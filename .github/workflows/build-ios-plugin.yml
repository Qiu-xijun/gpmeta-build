name: Build iOS Native Plugin (GPMetaModule)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'ios/**'
      - 'inc/**'
      - 'project.yml'
      - '.github/workflows/build-ios-plugin.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Xcode version
        run: xcodebuild -version && clang --version

      - name: Verify source files
        run: |
          echo "=== Source files in ios/ ==="
          ls -la ios/*.m ios/*.mm 2>/dev/null
          echo ""
          if [ -f "ios/GPMetaModule.mm" ]; then
            echo "✓ GPMetaModule.mm exists (ObjC++ approach)"
          else
            echo "✗ ERROR: GPMetaModule.mm not found!"
            exit 1
          fi
          echo ""
          echo "=== GPAppDelegate.m link reference check ==="
          if grep -q "GPMetaModule" ios/GPAppDelegate.m; then
            echo "✓ GPAppDelegate references GPMetaModule (link-time force-load)"
          else
            echo "✗ WARNING: GPAppDelegate does NOT reference GPMetaModule!"
            echo "  This is needed to force the linker to include GPMetaModule.o"
            exit 1
          fi

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Install CocoaPods
        run: pod install

      - name: Build for iOS device (arm64)
        run: |
          set -x
          xcodebuild build \
            -workspace GPMetaModule.xcworkspace \
            -scheme GPMetaModule \
            -configuration Release \
            -sdk iphoneos \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            -derivedDataPath build/device 2>&1 | tee /tmp/build_device.log
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== BUILD FAILED (exit code $EXIT_CODE) ==="
            echo "=== Error lines ==="
            grep -i "error:" /tmp/build_device.log | head -30
            echo "=== Last 50 lines ==="
            tail -50 /tmp/build_device.log
            exit $EXIT_CODE
          fi

      - name: Create .framework and verify
        run: |
          DEVICE_A=$(find build/device -name "libGPMetaModule.a" | head -1)
          echo "Device lib: ${DEVICE_A:-NOT_FOUND}"
          if [ -z "$DEVICE_A" ]; then
            echo "ERROR: Device .a not found!"
            find build -name "*.a" 2>/dev/null
            exit 1
          fi

          # Create .framework directory structure
          # HBuilderX links frameworks with -ObjC flag, which forces ALL .o files
          # to be included (no selective loading issue that plagued .a approach)
          rm -rf ios/GPMetaModule.framework
          mkdir -p ios/GPMetaModule.framework/Headers
          cp "$DEVICE_A" ios/GPMetaModule.framework/GPMetaModule
          cp ios/GPMetaModule.h ios/GPMetaModule.framework/Headers/
          cp inc/DCUniModule.h ios/GPMetaModule.framework/Headers/

          # Create minimal Info.plist
          cat > ios/GPMetaModule.framework/Info.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>com.goldpay.GPMetaModule</string>
              <key>CFBundleName</key>
              <string>GPMetaModule</string>
              <key>CFBundlePackageType</key>
              <string>FMWK</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.2</string>
          </dict>
          </plist>
          PLIST

          FW_BIN=ios/GPMetaModule.framework/GPMetaModule

          echo "=== Framework info ==="
          lipo -info "$FW_BIN"
          file "$FW_BIN"
          ls -lh "$FW_BIN"
          echo ""
          echo "=== Framework structure ==="
          find ios/GPMetaModule.framework -type f
          echo ""

          echo "=== GPMetaModule class symbols ==="
          nm "$FW_BIN" | grep -i "GPMetaModule" | head -20
          echo ""
          echo "=== __DCUniMethod section (raw dump) ==="
          otool -s __DATA __DCUniMethod "$FW_BIN" || echo "otool not available"
          echo ""
          echo "=== SEL values in __DCUniMethod ==="
          otool -X -s __DATA __DCUniMethod "$FW_BIN" 2>/dev/null | xxd | head -10 || echo "Could not dump"
          echo ""
          echo "=== UNI_EXPORT_METHOD symbols (_uni_sel_) ==="
          nm "$FW_BIN" | grep "_uni_sel_" | head -20
          echo ""
          echo "=== C++ static initializer present? ==="
          nm "$FW_BIN" | grep "GLOBAL__sub_I" | head -5
          echo ""
          echo "=== Method selectors in binary ==="
          strings "$FW_BIN" | grep -E "initMeta|testPlugin|fetchDeferredLink|requestTracking" | head -10
          echo ""
          echo "=== Object files in archive ==="
          ar t "$FW_BIN" 2>/dev/null || true
          echo ""
          echo "=== KEY: .framework will be linked with -ObjC by HBuilderX ==="
          echo "=== This forces ALL .o files to be included (no selective loading) ==="
          echo "=== __DATA,__DCUniMethod section will be present in final binary ==="
          echo "=== C++ static init fills SELs before main() ==="

      - name: Copy FBSDK frameworks to ios/
        run: |
          echo "=== Searching for xcframeworks in Pods ==="
          find Pods -name "*.xcframework" -maxdepth 5 2>/dev/null
          echo ""
          echo "=== Copying FBSDK frameworks ==="
          for fw in FBSDKCoreKit FBSDKCoreKit_Basics FBAEMKit; do
            found=$(find Pods -name "${fw}.xcframework" -maxdepth 5 | head -1)
            if [ -n "$found" ]; then
              echo "Copying: $found -> ios/"
              rm -rf "ios/${fw}.xcframework"
              cp -r "$found" "ios/"
            else
              echo "WARNING: ${fw}.xcframework not found!"
            fi
          done
          echo ""
          echo "=== All xcframeworks in ios/ ==="
          ls -d ios/*.xcframework 2>/dev/null || echo "No xcframeworks found"

      - name: Trim xcframeworks to arm64 device only
        run: |
          python3 - <<'PYEOF'
          import plistlib, shutil
          from pathlib import Path
          ios = Path("ios")
          for fw in ios.glob("*.xcframework"):
              plist_path = fw / "Info.plist"
              with open(plist_path, "rb") as f:
                  plist = plistlib.load(f)
              kept = []
              for lib in plist["AvailableLibraries"]:
                  if lib["LibraryIdentifier"] == "ios-arm64":
                      kept.append(lib)
                  else:
                      slice_dir = fw / lib["LibraryIdentifier"]
                      if slice_dir.exists():
                          shutil.rmtree(slice_dir)
                          print(f"  {fw.name}: removed {lib['LibraryIdentifier']}")
              plist["AvailableLibraries"] = kept
              with open(plist_path, "wb") as f:
                  plistlib.dump(plist, f)
              print(f"  {fw.name}: kept ios-arm64 only")
          PYEOF
          echo "=== Final sizes ==="
          du -sh ios/*.xcframework
          du -sh ios/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GPMetaModule-framework-bundle
          path: |
            ios/GPMetaModule.framework
            ios/*.xcframework
          retention-days: 90

      - name: Commit back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Remove old .a if it exists
          git rm -f ios/libGPMetaModule.a 2>/dev/null || true
          # Add .framework
          git add -f ios/GPMetaModule.framework
          find ios -maxdepth 1 -name "*.xcframework" -exec git add {} \;
          git diff --staged --quiet || git commit -m "build: switch to .framework (fixes selective loading — HBuilderX uses -ObjC for frameworks) [skip ci]"
          git push || echo "Nothing to push"
